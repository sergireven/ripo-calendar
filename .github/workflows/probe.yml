name: Sonda fonts (temporal)
on:
  push:
    branches: ['probe/**']
    paths: ['probe/*.mjs', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: echo sense-navegador
      - run: node probe/probe.mjs || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe-out probe-out2
          git commit -m "Resultats sonda" || true
          git push
